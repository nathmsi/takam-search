name: Refresh the data

# Every day: read the Takam site again. When it changed, test the new data and commit it, then start the CI/CD (ci.yml), which
# runs every check again and is the only thing that deploys. The embeddings of the new or changed documents are made in the
# same run (a script that calls Gemini for what changed only).
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    name: Read the site, test, commit, start the CI/CD
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the site (fails, and keeps the old files, when its answer looks wrong)
        run: pnpm --filter @takam/server data:refresh
      - name: Make the embeddings of the new or changed documents (the AI search; only when the GEMINI_API_KEY secret exists)
        if: env.GEMINI_API_KEY != ''
        run: pnpm --filter @takam/server data:embed --all
      - name: Did the data change?
        id: changes
        run: |
          if git diff --quiet -- apps/server/data; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Test the server on the new data
        if: steps.changes.outputs.changed == 'true'
        run: pnpm test:server
      - name: Commit the new data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/data
          git commit -m "chore(data): read the Takam site again"
          git push
      - name: Run the CI/CD, which checks everything again and deploys (a push made with the workflow token starts nothing by itself)
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
