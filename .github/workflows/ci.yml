name: CI

on:
  push:
  pull_request:

# A newer push to the same branch/PR supersedes the running pipeline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint · Type-check · Build · Server and web tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # The install also builds the contracts package (root "prepare" script).
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Build (server and web)
        run: pnpm build
      - name: Server unit and end-to-end tests (the real SQL on the real data, in memory, no network)
        run: pnpm test:server
      - name: Web unit and component tests
        run: pnpm test:web

  e2e:
    name: E2E tests (Playwright, on the builds, with the real server and the real web app)
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @takam/web exec playwright install --with-deps chromium
      - name: E2E tests (mobile and desktop)
        run: pnpm --filter @takam/web exec playwright test
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
